name: tss-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-pptx>=1.0" "pytest>=8" "pytest-cov>=5"

      - name: Compile check (every tracked .py)
        shell: bash
        run: |
          python - <<'EOF'
          import compileall
          import pathlib
          import sys
          files = [
              str(p) for p in pathlib.Path(".").rglob("*.py")
              if ".venv" not in p.parts and "AmbieGen-tool" not in p.parts
          ]
          ok = True
          for f in files:  # one by one so a single bad file names itself
              if not compileall.compile_file(f, quiet=1):
                  print(f"COMPILE FAIL: {f}")
                  ok = False
          print(f"compiled {len(files)} files")
          sys.exit(0 if ok else 1)
          EOF

      - name: Run tests (100% line+branch gate)
        shell: bash
        run: |
          python -m pytest --cov --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage XML
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7
